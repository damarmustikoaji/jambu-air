name: Social Media Scraper

on:
  # Scheduled: setiap hari jam 20:00 WIB (13:00 UTC)
  schedule:
    - cron: "0 13 * * *"

  # Manual trigger dengan pilihan lengkap
  workflow_dispatch:
    inputs:
      platform:
        description: "🌐 Platform yang di-scrape"
        required: true
        default: "tiktok threads"
        type: choice
        options:
          - "tiktok threads"
          - "tiktok"
          - "threads"
      query:
        description: "🔍 Keyword pencarian (kosongkan = pakai SEARCH_QUERY dari Settings)"
        required: false
        default: ""
      max_results:
        description: "📊 Maksimal hasil per platform (contoh: 20, 50, 100)"
        required: false
        default: "50"
      scroll_count:
        description: "🔄 Jumlah scroll TikTok — lebih banyak = lebih banyak hasil (maks 10)"
        required: false
        default: "6"

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Resolve input parameters
        id: resolve
        run: |
          # Query: pakai input manual jika diisi, fallback ke variable setting
          INPUT_QUERY="${{ github.event.inputs.query }}"
          if [ -z "$INPUT_QUERY" ]; then
            FINAL_QUERY="${{ vars.SEARCH_QUERY }}"
          else
            FINAL_QUERY="$INPUT_QUERY"
          fi
          echo "query=$FINAL_QUERY" >> $GITHUB_OUTPUT

          # Platform: default keduanya saat scheduled
          INPUT_PLATFORM="${{ github.event.inputs.platform }}"
          if [ -z "$INPUT_PLATFORM" ]; then
            FINAL_PLATFORM="tiktok threads"
          else
            FINAL_PLATFORM="$INPUT_PLATFORM"
          fi
          echo "platform=$FINAL_PLATFORM" >> $GITHUB_OUTPUT

          # Max results: pakai input jika diisi, fallback ke default CI
          INPUT_MAX="${{ github.event.inputs.max_results }}"
          if [ -z "$INPUT_MAX" ]; then
            FINAL_MAX="100"
          else
            FINAL_MAX="$INPUT_MAX"
          fi
          echo "max_results=$FINAL_MAX" >> $GITHUB_OUTPUT

          # Scroll count: pakai input jika diisi, fallback ke default CI
          INPUT_SCROLL="${{ github.event.inputs.scroll_count }}"
          if [ -z "$INPUT_SCROLL" ]; then
            FINAL_SCROLL="8"
          else
            FINAL_SCROLL="$INPUT_SCROLL"
          fi
          echo "scroll_count=$FINAL_SCROLL" >> $GITHUB_OUTPUT

      - name: Restore cookies dari GitHub Secrets
        run: |
          mkdir -p cookies

          if [ -n "${{ secrets.TIKTOK_COOKIES_B64 }}" ]; then
            echo "${{ secrets.TIKTOK_COOKIES_B64 }}" | base64 -d > cookies/tiktok_cookies.json
            echo "✅ TikTok cookies restored"
          else
            echo "⚠️  TIKTOK_COOKIES_B64 tidak diset — scraper jalan tanpa login TikTok"
          fi

          if [ -n "${{ secrets.THREADS_COOKIES_B64 }}" ]; then
            echo "${{ secrets.THREADS_COOKIES_B64 }}" | base64 -d > cookies/threads_cookies.json
            echo "✅ Threads cookies restored"
          else
            echo "⚠️  THREADS_COOKIES_B64 tidak diset — scraper jalan tanpa login Threads"
          fi

      - name: Run scraper
        env:
          SEARCH_QUERY: ${{ steps.resolve.outputs.query }}
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          TIKTOK_COOKIES_FILE: cookies/tiktok_cookies.json
          THREADS_COOKIES_FILE: cookies/threads_cookies.json
          HEADLESS: "true"
          SLOW_MO: "1000"
          TIKTOK_MAX_RESULTS: ${{ steps.resolve.outputs.max_results }}
          THREADS_MAX_RESULTS: ${{ steps.resolve.outputs.max_results }}
          TIKTOK_SCROLL_COUNT: ${{ steps.resolve.outputs.scroll_count }}
          API_TIMEOUT: "30"
        run: |
          PLATFORM_FLAG="${{ steps.resolve.outputs.platform }}"

          echo "========================================"
          echo "Query        : $SEARCH_QUERY"
          echo "Platform     : $PLATFORM_FLAG"
          echo "Max Results  : $TIKTOK_MAX_RESULTS"
          echo "Scroll Count : $TIKTOK_SCROLL_COUNT"
          echo "API URL      : $API_URL"
          echo "========================================"

          python main.py --query "$SEARCH_QUERY" --platform $PLATFORM_FLAG --save

      - name: Upload artifact (hasil scraping + screenshot debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-result-${{ github.run_id }}
          path: |
            output_*.json
            screenshots/
          retention-days: 7
